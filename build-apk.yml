name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev libltdl-dev

      - name: 安装 buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: 缓存 Android SDK / NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: 构建 APK
        run: |
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          yes | buildozer -v android debug

      - name: 收集产物
        run: |
          mkdir -p out
          cp bin/*.apk out/ 2>/dev/null || true
          ls -lh out/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: foobarlite-apk
          path: out/*.apk
          if-no-files-found: error
